<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { cursor: progress; opacity: .6; }
    #status { min-height: 2.5rem; margin: .75rem 0; }
    #status[data-kind="ready"] { color: #146c2e; }
    #status[data-kind="manual_review"], #status[data-kind="invalid_input"] { color: #8a4b00; }
    #status[data-kind="error"] { color: #a11; }
    #result { border: 1px solid #d0d0d0; border-radius: .4rem; padding: .5rem 1rem; }
    #result dt { font-weight: 600; }
    #result dd { margin: 0 0 .75rem; white-space: pre-wrap; }
    #result dd:last-child { margin-bottom: 0; }
    .hint { color: #555; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" required></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <dl id="result" aria-live="polite" hidden>
    <dt>Тема</dt>
    <dd id="topic"></dd>
    <dt>Черновик ответа</dt>
    <dd id="draft"></dd>
  </dl>
  <p class="hint">AI готовит черновик. Решение об отправке остаётся за менеджером.</p>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    const MESSAGES = {
      invalid_input: "Введите текст заявки: пустую заявку нельзя отправить на разбор.",
      manual_review:
        "AI не смог разобрать заявку. Разберите её вручную: черновик очищен, чтобы не отправить клиенту устаревший текст.",
      error: "Сервис недоступен. Разберите заявку вручную: черновик очищен.",
    };

    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const submitButton = form.querySelector("button");
    const statusLine = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topicCell = document.querySelector("#topic");
    const draftCell = document.querySelector("#draft");

    function clearResult() {
      topicCell.textContent = "";
      draftCell.textContent = "";
      result.hidden = true;
    }

    function showStatus(kind, message) {
      statusLine.textContent = message;
      statusLine.dataset.kind = kind;
    }

    function showResult(payload, httpStatus) {
      // Любой не-success ответ сначала очищает прошлый черновик.
      clearResult();

      if (httpStatus === 400 || (payload && payload.status === "invalid_input")) {
        showStatus("invalid_input", MESSAGES.invalid_input);
        return;
      }

      if (
        payload &&
        payload.status === "ready" &&
        typeof payload.topic === "string" &&
        Object.prototype.hasOwnProperty.call(TOPIC_LABELS, payload.topic) &&
        typeof payload.draft === "string" &&
        payload.draft.trim() !== ""
      ) {
        topicCell.textContent = TOPIC_LABELS[payload.topic];
        draftCell.textContent = payload.draft.trim();
        result.hidden = false;
        showStatus("ready", "Черновик готов. Проверьте текст и отправьте клиенту.");
        return;
      }

      if (payload && payload.status === "manual_review") {
        showStatus("manual_review", MESSAGES.manual_review);
        return;
      }

      showStatus("error", MESSAGES.error);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        showResult({ status: "invalid_input" }, 400);
        input.focus();
        return;
      }

      submitButton.disabled = true;
      clearResult();
      showStatus("pending", "Разбираем заявку…");

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const payload = await reply.json().catch(() => null);
        showResult(payload, reply.status);
      } catch {
        showResult(null, 0);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
